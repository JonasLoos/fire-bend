name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bend
        run: |
          curl -fsSL https://bend-lang.com/install.sh | sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - run: cargo test
        env:
          BEND_TESTS: require
          BEND_NO_TELEMETRY: "1"
